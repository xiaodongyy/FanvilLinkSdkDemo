plugins {
    alias(libs.plugins.android.application)
}

// true = 依赖源码模块调试；false = 依赖 app/libs 下 AAR（交付形态）
def useSdkSource = false

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('keystore.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace 'com.example.fanviltalksdkdemo'
    compileSdk {
        version = release(36) {
            minorApiLevel = 1
        }
    }

    defaultConfig {
        applicationId "com.example.fanviltalksdkdemo"
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        release {
            storeFile rootProject.file(keystoreProperties['storeFile'])
            storePassword keystoreProperties['storePassword']
            keyAlias keystoreProperties['keyAlias']
            keyPassword keystoreProperties['keyPassword']
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.release
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    packaging {
        resources {
            pickFirsts += ['bundle.properties']
        }
        jniLibs {
            useLegacyPackaging = true
            pickFirsts += [
                'lib/*/libc++_shared.so',
                'lib/*/libimagepipeline.so',
                'lib/*/libnative-filters.so',
                'lib/*/libnative-imagetranscoder.so',
                'lib/*/libavcodec.so'
            ]
        }
    }
    packaging {
        jniLibs {
            excludes += ['**/zipDir.so', '**/libAMapSDK_MAP_v10_1_500.so']
        }
    }
    defaultConfig {
        ndk {
            abiFilters  "armeabi-v7a","arm64-v8a"
        }
    }
}

dependencies {
    implementation libs.androidx.core.ktx

    if (useSdkSource) {
        implementation project(':fanvil-link-sdk')
    } else {
        implementation files('libs/fv_cloud_talk-sdk-0.0.7-release.aar')
    }
    // 源码/AAR 模式均需宿主提供 linphone；AAR 模式还需显式引入 rinoPanel
    implementation files('libs/linphone-sdk-android-0.0.12-release.aar')
    if (!useSdkSource) {
        implementation('com.smart.rinoiot:rinoPanel:1.2.1') {
            exclude module: 'common-log'
            exclude module: 'common-res'
            exclude module: 'rinoReactNative'
            exclude module: 'rinoReactNativeV8'
            exclude module: 'rinoReactFastImage'
            exclude module: 'rinoReactReanimated'
            exclude module: 'rinoReactGesture'
            exclude module: 'rinoReactScreens'
            exclude module: 'rinoReactSafeArea'
            exclude module: 'rinoReactSvg'
            exclude module: 'rinoReactAsyncStorage'
            exclude module: 'rinoReactCommunityBlur'
            exclude module: 'rinoReactCommunityMaskedView'
            exclude module: 'rinoReactCropPicker'
            exclude module: 'rinoReactPagerView'
            exclude module: 'rinoReactPicker'
            exclude module: 'rinoReactVideo'
            exclude module: 'rinoReactWebview'
            exclude module: 'rinoReactLottiee'
            exclude module: 'rinoReactFfmpeg'
            exclude module: 'rinoMatterSdk'
            exclude group: 'com.linecorp.linesdk', module: 'linesdk'
            exclude group: 'com.github.adityaxjha', module: 'Android-ScalableVideoView'
            exclude group: 'com.github.yalantis', module: 'ucrop'
            exclude group: 'com.github.Dimezis', module: 'BlurView'
            exclude group: 'com.android.support'
        }
    }

    testImplementation libs.junit
    androidTestImplementation libs.androidx.junit
    androidTestImplementation libs.androidx.espresso.core
}
